[package]
name = "miyoushe"
version = "0.1.0"
edition = "2024"
description = "爬取米游社（miyoushe.com）用户主页所有帖子中图片的命令行工具"
license = "MIT"
repository = "https://github.com/aachou/miyoushe"
homepage = "https://github.com/aachou/miyoushe"
documentation = "https://docs.rs/miyoushe"
readme = "README.md"
keywords = ["miyoushe", "mihoyo", "scraper", "crawler", "images"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3"
indicatif = "0.17"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "macros"] }
url = "2"
